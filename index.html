<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilha Financeira</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root">
    <div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-6">
      <div class="max-w-7xl mx-auto">
        <div class="mb-8">
          <h1 class="text-3xl font-bold text-slate-800 mb-2">Controle Financeiro</h1>
          <p class="text-slate-600">Dashboard completo das suas finanças</p>
        </div>

        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between mb-2">
              <span class="text-slate-600 text-sm font-medium">Receitas</span>
              <span class="text-green-500">📈</span>
            </div>
            <div class="text-2xl font-bold text-green-600" id="total-income">R$ 0,00</div>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between mb-2">
              <span class="text-slate-600 text-sm font-medium">Despesas</span>
              <span class="text-red-500">📉</span>
            </div>
            <div class="text-2xl font-bold text-red-600" id="total-expenses">R$ 0,00</div>
          </div>

          <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between mb-2">
              <span class="text-slate-600 text-sm font-medium">Saldo</span>
              <span class="text-blue-500">💰</span>
            </div>
            <div class="text-2xl font-bold text-blue-600" id="balance">R$ 0,00</div>
          </div>
        </div>

        <!-- Formulário -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 mb-8">
          <h3 class="text-lg font-semibold text-slate-800 mb-4">Nova Transação</h3>
          <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
            <input type="date" id="date" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="text" id="description" placeholder="Descrição" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select id="category" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option>Alimentação</option>
              <option>Transporte</option>
              <option>Moradia</option>
              <option>Saúde</option>
              <option>Educação</option>
              <option>Lazer</option>
              <option>Salário</option>
              <option>Investimentos</option>
              <option>Outros</option>
            </select>
            <select id="type" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="expense">Despesa</option>
              <option value="income">Receita</option>
            </select>
            <input type="number" id="amount" step="0.01" placeholder="Valor" class="px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="addTransaction()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">➕ Adicionar</button>
          </div>
        </div>

        <!-- Tabela -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200">
          <div class="p-6 border-b border-slate-200 flex justify-between items-center">
            <h3 class="text-lg font-semibold text-slate-800">Transações</h3>
            <button onclick="exportCSV()" class="flex items-center gap-2 px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-lg transition">
              💾 Exportar CSV
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-slate-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase">Data</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase">Descrição</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase">Categoria</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase">Tipo</th>
                  <th class="px-6 py-3 text-right text-xs font-medium text-slate-600 uppercase">Valor</th>
                  <th class="px-6 py-3 text-center text-xs font-medium text-slate-600 uppercase">Ações</th>
                </tr>
              </thead>
              <tbody id="transactions-body" class="divide-y divide-slate-200">
                <tr>
                  <td colspan="6" class="px-6 py-8 text-center text-slate-400">
                    Nenhuma transação cadastrada
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');

    // Definir data de hoje ao carregar
    document.getElementById('date').valueAsDate = new Date();

    function formatCurrency(value) {
      return 'R$ ' + value.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('pt-BR');
    }

    function updateTotals() {
      const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
      const expenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
      const balance = income - expenses;

      document.getElementById('total-income').textContent = formatCurrency(income);
      document.getElementById('total-expenses').textContent = formatCurrency(expenses);
      document.getElementById('balance').textContent = formatCurrency(balance);
      document.getElementById('balance').className = 'text-2xl font-bold ' + (balance >= 0 ? 'text-blue-600' : 'text-red-600');
    }

    function renderTransactions() {
      const tbody = document.getElementById('transactions-body');
      
      if (transactions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-400">Nenhuma transação cadastrada</td></tr>';
        return;
      }

      tbody.innerHTML = transactions.map((t, index) => `
        <tr class="hover:bg-slate-50">
          <td class="px-6 py-4 text-sm text-slate-600">${formatDate(t.date)}</td>
          <td class="px-6 py-4 text-sm text-slate-800">${t.description}</td>
          <td class="px-6 py-4 text-sm text-slate-600">${t.category}</td>
          <td class="px-6 py-4 text-sm">
            <span class="px-2 py-1 rounded-full text-xs font-medium ${t.type === 'income' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
              ${t.type === 'income' ? 'Receita' : 'Despesa'}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-right font-medium ${t.type === 'income' ? 'text-green-600' : 'text-red-600'}">
            ${formatCurrency(t.amount)}
          </td>
          <td class="px-6 py-4 text-center">
            <button onclick="deleteTransaction(${index})" class="text-red-600 hover:text-red-700 text-xl">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function addTransaction() {
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value;
      const category = document.getElementById('category').value;
      const type = document.getElementById('type').value;
      const amount = parseFloat(document.getElementById('amount').value);

      if (!description || !amount || !date) {
        alert('Preencha todos os campos!');
        return;
      }

      transactions.push({ date, description, category, type, amount });
      localStorage.setItem('transactions', JSON.stringify(transactions));

      // Limpar formulário
      document.getElementById('description').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('date').valueAsDate = new Date();

      updateTotals();
      renderTransactions();
    }

    function deleteTransaction(index) {
      if (confirm('Deseja realmente excluir esta transação?')) {
        transactions.splice(index, 1);
        localStorage.setItem('transactions', JSON.stringify(transactions));
        updateTotals();
        renderTransactions();
      }
    }

    function exportCSV() {
      if (transactions.length === 0) {
        alert('Nenhuma transação para exportar!');
        return;
      }

      const headers = ['Data', 'Descrição', 'Categoria', 'Tipo', 'Valor'];
      const rows = transactions.map(t => [
        t.date,
        t.description,
        t.category,
        t.type === 'income' ? 'Receita' : 'Despesa',
        t.amount.toFixed(2)
      ]);

      const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', 'financeiro.csv');
      link.click();
    }

    // Carregar ao iniciar
    updateTotals();
    renderTransactions();
  </script>
</body>
</html>
